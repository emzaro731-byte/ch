name: Trading Bot

on:
  workflow_dispatch:
  push:
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/trading-bot.yml"
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ask Supabase trading service for crypto analysis
        run: |
          curl --fail-with-body -sS             -X POST             -H "Content-Type: application/json"             -H "x-bot-token: $SUPABASE_BOT_TOKEN"             --data '{"symbol":"BTCUSDT"}'             "$SUPABASE_FUNCTION_URL"
        env:
          SUPABASE_BOT_TOKEN: ${{ secrets.SUPABASE_BOT_TOKEN }}
          SUPABASE_FUNCTION_URL: https://vihbsfrwnslnmheowkhy.supabase.co/functions/v1/trading-bot

      - name: Run forex AI analysis (paper only)
        run: python bot.py
        env:
          MARKET: forex
          FOREX_PAIRS: EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF,NZDUSD
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIN_AI_CONFIDENCE: "75"
          MIN_SIGNAL_SCORE: "75"
          QUOTE_AMOUNT: "5"
          MAX_POSITION_USDT: "5"
          EXECUTION_MODE: "practice"
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"
          OANDA_UNITS: "1"
