name: Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - name: Ask Supabase trading service for analysis
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-bot-token: $SUPABASE_BOT_TOKEN" \
            --data '{"symbol":"BTCUSDT"}' \
            "$SUPABASE_FUNCTION_URL"
        env:
          SUPABASE_BOT_TOKEN: ${{ secrets.SUPABASE_BOT_TOKEN }}
          SUPABASE_FUNCTION_URL: https://vihbsfrwnslnmheowkhy.supabase.co/functions/v1/trading-bot

