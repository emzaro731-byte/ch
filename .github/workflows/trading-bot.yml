name: Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SYMBOL: BTCUSDT
          QUOTE_AMOUNT: "5"
          MAX_POSITION_USDT: "5"
          STOP_LOSS_PCT: "2"
          TAKE_PROFIT_PCT: "3"
          LIVE_TRADING: "false"
