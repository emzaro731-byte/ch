name: Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name veylola_trade .

      - name: Enable Android internet access
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
                  1,
              )

          path.write_text(text)
          PY

          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: veylola-trade-flutter-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
